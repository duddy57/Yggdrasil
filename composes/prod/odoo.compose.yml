x-odoo-base: &odoo-base
  image: odoo:${ODOO_VERSION}
  restart: unless-stopped
  volumes:
    - odoo-data:/var/lib/odoo
    - ${ODOO_CONFIG_PATH}:/etc/odoo/odoo.conf:ro
    - ./custom-addons:/mnt/extra-addons:ro

  environment:
    - HOST=${ODOO_DB_HOST}
    - USER=${ODOO_DB_USER}
    - PASSWORD=${ODOO_DB_PASSWORD}

  networks:
    - public
    - database


services:
  odoo:
    <<: *odoo-base

    healthcheck:
      test:
      - CMD-SHELL
        - >-
        python3 -c "from urllib.request import urlopen;
        urlopen('http://127.0.0.1:8069/web/login', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${ODOO_PORT}:8069"
      - "${ODOO_GEVENT_PORT}:8072"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public_attachable"
      - "traefik.http.routers.odoo.rule=Host(`${ODOO_DOMAIN}`)"
      - "traefik.http.routers.odoo.entrypoints=websecure"
      - "traefik.http.routers.odoo.tls=true"
      - "traefik.http.routers.odoo.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.odoo.loadbalancer.server.port=${ODOO_PORT}"

volumes:
  odoo-data:

networks:
  database:
    external: true
    name: network_database

  public:
    external: true
    name: network_public_attachable
