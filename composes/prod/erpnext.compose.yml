x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${ERPNEXT_VERSION:-v15}
  pull_policy: always
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on-configurator, *customizable_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  configurator:
    <<: *customizable_image

    entrypoint:
      - bash
      - -c

    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;

    environment:
      DB_HOST: databases_mariadb
      DB_PORT: "3306"
      REDIS_CACHE: ${REDIS_CACHE:-databases_redis:6379/0}
      REDIS_QUEUE: ${REDIS_QUEUE:-databases_redis:6379/1}

    volumes:
      - sites:/home/frappe/frappe-bench/sites

    restart: "no"

  backend:
    <<: *backend_defaults

    environment:
      GUNICORN_THREADS: 4
      GUNICORN_WORKERS: 2
      GUNICORN_TIMEOUT: 120

    networks:
      - default
      - database_internal

  frontend:
    <<: *customizable_image

    command:
      - nginx-entrypoint.sh

    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: 8080
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: ${TRAEFIK_NETWORK_CIDR}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m

    volumes:
      - sites:/home/frappe/frappe-bench/sites

    depends_on:
      - backend
      - websocket

    networks:
      - default
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=network_public_attachable

      - traefik.http.routers.erpnext.rule=Host(`${ERP_DOMAIN}`)
      - traefik.http.routers.erpnext.entrypoints=websecure
      - traefik.http.routers.erpnext.tls=true
      - traefik.http.routers.erpnext.tls.certresolver=${TRAEFIK_CERT_RESOLVER}

      - traefik.http.services.erpnext.loadbalancer.server.port=8080

  websocket:
    <<: [*depends_on_configurator, *customizable_image]

    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

    volumes:
      - sites:/home/frappe/frappe-bench/sites

    networks:
      - default
      - database_internal

  queue-short:
    <<: *backend_defaults

    command: bench worker --queue short,default

    networks:
      - default
      - database_internal

  queue-long:
    <<: *backend_defaults

    command: bench worker --queue long,default,short

    networks:
      - default
      - database_internal

  scheduler:
    <<: *backend_defaults

    command: bench schedule

    networks:
      - default
      - database_interna

volumes:
  sites:
    name: erpnext_sites

networks:
  database_internal:
    external: true
    name: network_database

  proxy:
    external: true
    name: network_public_attachable