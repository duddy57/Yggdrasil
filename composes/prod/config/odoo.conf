[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

# Substitua por uma senha mestra forte antes do primeiro deploy.
admin_passwd = CHANGE_ME_BEFORE_DEPLOYING

# A conexão PostgreSQL vem de HOST, USER e PASSWORD definidos no Compose.
# Não defina db_host/db_user/db_password aqui: estes valores sobrescreveriam
# as variáveis de ambiente usadas pela imagem oficial do Odoo.
db_name = production
db_maxconn = 64
list_db = False

proxy_mode = True
workers = 4
max_cron_threads = 2
gevent_port = 8072

limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

log_level = warn
