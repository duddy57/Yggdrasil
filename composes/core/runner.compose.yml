name: runner

services:
  dind:
    image: docker:29.9.3-dind
    privileged: true
    restart: unless-stopped
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
  volumes:
    - dind-data:/var/lib/docker
  runner:
    image: code.forgejo.org/forgejo/runner:13.2.0
    depends_on:
      dind:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://dind:2375
    user: 1000:1000
    volumes:
      - /opt/forgejo-runner/data:/data
      - /opt/forgejo-runner/config.yaml:/config.yaml:ro
    restart: unless-stopped
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config /config.yaml"'

volumes:
  dind-data:
