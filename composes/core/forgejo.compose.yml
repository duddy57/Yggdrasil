name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo

      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__HTTP_PORT: ${FORGEJO_PORT}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT}
      FORGEJO__server__SSH_LISTEN_PORT: ${FORGEJO_SSH_PORT}

      FORGEJO__database__DB_TYPE: ${FORGEJO_DB_TYPE}
      FORGEJO__database__HOST: ${FORGEJO_DB_HOST}
      FORGEJO__database__NAME: ${FORGEJO_DB_NAME}
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}

      GNUPGHOME: /data/gitea/home/.gnupg
    volumes:
      - /opt/forgejo/data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: network_public_attachable
      traefik.http.routers.forgejo.rule: "Host(`${FORGEJO_HOST}`)"
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.tls: "true"
      traefik.http.routers.forgejo.tls.certresolver: letsencryptresolver
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"
    networks:
      - database
      - public

networks:
  database:
    external: true
    name: network_database

  public:
    external: true
    name: network_public_attachable
