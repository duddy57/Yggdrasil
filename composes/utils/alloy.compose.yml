name: alloy

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    hostname: ${HOST_NAME}
    networks:
      - database
      - public
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/conf.d
    environment:
      HOST_NAME: ${HOST_NAME}
      MONITORING_CENTRAL_IP: ${MONITORING_CENTRAL_IP}
      TRAEFIK_METRICS_ADDRESS: ${TRAEFIK_METRICS_ADDRESS}
      OTEL_RESOURCE_ATTRIBUTES: host.name=${HOST_NAME},deployment.environment=production
    ports:
      - "${NETBIRD_IP}:12345:12345"
    # Descomente apenas nas VMs onde mantiver otlp.alloy:
    # - "${NETBIRD_IP}:4317:4317"
    # - "${NETBIRD_IP}:4318:4318"
    # Descomente apenas nas VMs onde mantiver logs-syslog.alloy:
    # - "${NETBIRD_IP}:1514:1514/tcp"
    # - "${NETBIRD_IP}:1514:1514/udp"
    # - "${NETBIRD_IP}:1515:1515/tcp"
    # - "${NETBIRD_IP}:1515:1515/udp"
    volumes:
      - /etc/alloy/conf.d:/etc/alloy/conf.d:ro
      - /var/lib/alloy/data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker/:ro
      - /run/udev/data:/run/udev/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  database:
    external: true
    name: network_database

  public:
    external: true
    name: network_public_attachable
