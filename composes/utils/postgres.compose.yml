services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWD}
      - POSTGRES_DB=${DATABASE_DEFAULT}
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DEFAULT}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
  
networks:
  database_internal:
    external: true
    name: network_database
