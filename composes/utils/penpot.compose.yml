x-flags: &penpot-flags
  PENPOT_FLAGS: enable-smtp enable-login-with-oidc enable-admin-console enable-mcp disable-prepl-server enable-oidc-registration disable-login-with-password

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: https://${PENPOT_DOMAIN:?Set PENPOT_DOMAIN}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_BODY: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Set PENPOT_SECRET_KEY}

x-database: &penpot-database
  PENPOT_DATABASE_URI: ${PENPOT_DATABASE_URI:-postgresql://databases_postgres:5432/penpot}
  PENPOT_DATABASE_USERNAME: ${PENPOT_DATABASE_USERNAME:?Set PENPOT_DATABASE_USERNAME}
  PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Set PENPOT_DATABASE_PASSWORD}


networks:
  penpot: {}

  database:
    external: true
    name: network_database

  public:
    external: true
    name: network_public_attachable

volumes:
  penpot_assets:


services:
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-2.18}"
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-admin-console
      - penpot-mcp
      - penpot-exporter
    networks:
      - penpot
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public_attachable"
      - "traefik.http.routers.penpot.rule=Host(`${PENPOT_DOMAIN:?Set PENPOT_DOMAIN}`)"
      - "traefik.http.routers.penpot.entrypoints=websecure"
      - "traefik.http.routers.penpot.tls=true"
      - "traefik.http.routers.penpot.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.penpot.service=penpot"
      - "traefik.http.services.penpot.loadbalancer.server.port=8080"
    environment:
      << : [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]

      # Don't touch it; this uses an internal docker network to
      # communicate with the admin-console.
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-2.18}"
    restart: always

    volumes:
      - penpot_assets:/opt/data/assets

    depends_on:
      penpot-valkey:
        condition: service_healthy

    networks:
      - penpot
      - database

    ## Configuration environment variables for the backend container.


    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key, *penpot-database]

      PENPOT_OIDC_BASE_URI: ${PENPOT_OIDC_BASE_URI:?Set PENPOT_OIDC_BASE_URI}
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_CLIENT_ID:?Set PENPOT_OIDC_CLIENT_ID}
      PENPOT_OIDC_CLIENT_SECRET: ${PENPOT_OIDC_CLIENT_SECRET:?Set PENPOT_OIDC_CLIENT_SECRET}

      # Don't touch it; this uses an internal docker network to
      # communicate with the admin-console.
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

      ## Valkey (or previously redis) is used for the websockets notifications. Don't touch
      ## unless the valkey container has different parameters or different name.
      PENPOT_REDIS_URI: redis://penpot-valkey/0

      ## Default configuration for assets storage: using filesystem based with all files
      ## stored in a docker volume.
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets

      ## Also can be configured to to use a S3 compatible storage.
      # AWS_ACCESS_KEY_ID: <KEY_ID>
      # AWS_SECRET_ACCESS_KEY: <ACCESS_KEY>
      # PENPOT_OBJECTS_STORAGE_BACKEND: s3
      # PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: <ENDPOINT>
      # PENPOT_OBJECTS_STORAGE_S3_BUCKET: <BUKET_NAME>

      ## Telemetry. When enabled, a periodical process will send anonymous data about this
      ## instance. Telemetry data will enable us to learn how the application is used,
      ## based on real scenarios. If you want to help us, please leave it enabled. You can
      ## audit what data we send with the code available on github.
      PENPOT_TELEMETRY_ENABLED: "true"
      PENPOT_TELEMETRY_REFERER: compose

      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:?Set PENPOT_SMTP_DEFAULT_FROM}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-${PENPOT_SMTP_DEFAULT_FROM:?Set PENPOT_SMTP_DEFAULT_FROM}}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST:?Set PENPOT_SMTP_HOST}
      PENPOT_SMTP_PORT: "${PENPOT_SMTP_PORT:-587}"
      PENPOT_SMTP_USERNAME: "${PENPOT_SMTP_USERNAME:-}"
      PENPOT_SMTP_PASSWORD: "${PENPOT_SMTP_PASSWORD:-}"
      PENPOT_SMTP_TLS: "${PENPOT_SMTP_TLS:-true}"
      PENPOT_SMTP_SSL: "${PENPOT_SMTP_SSL:-false}"

  ## Inbox for the feedback that MCP agents send. Set it together with
  ## PENPOT_MCP_BACKEND_URI on the penpot-mcp service.
  # PENPOT_MCP_FEEDBACK_EMAIL: mcp-feedback@example.com

  penpot-admin-console:
    image: "penpotapp/admin-console:${PENPOT_VERSION:-2.18}"
    restart: always

    networks:
      - penpot
      - database

    environment:
      << : [*penpot-public-uri, *penpot-secret-key, *penpot-database]

      # Don't touch it; this uses an internal docker network to
      # communicate with the frontend.
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-mcp:
    image: "penpotapp/mcp:${PENPOT_VERSION:-2.18}"
    restart: always
    networks:
      - penpot

  # environment:
  ## Offers the submit_feedback tool, which emails agent feedback through the
  ## backend. Set it together with PENPOT_MCP_FEEDBACK_EMAIL on the backend.
  # PENPOT_MCP_BACKEND_URI: http://penpot-backend:6060/

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-2.18}"
    restart: always

    depends_on:
      penpot-valkey:
        condition: service_healthy

    networks:
      - penpot

    environment:
      << : [*penpot-flags, *penpot-secret-key, *penpot-public-uri]

      # Don't touch it; this uses an internal docker network to
      # communicate with the frontend.
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

      ## Valkey (or previously Redis) is used for the websockets notifications
      ## and for storing the state export jobs
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  # PENPOT_EXPORTER_MAX_CONCURRENT_JOBS: 4
  # PENPOT_EXPORTER_MAX_JOBS_PER_PROFILE: 2
  # PENPOT_EXPORTER_QUEUE_MAX: 64
  # PENPOT_EXPORTER_JOB_TTL: 3600
  # PENPOT_WASM_WORKER_POOL_MAX: 2
  # PENPOT_WASM_WORKER_POOL_MIN: 1
  # PENPOT_WASM_WORKER_IDLE_TIMEOUT: 300
  # PENPOT_WASM_WORKER_IMAGE_CACHE_SIZE: 134217728

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s

    networks:
      - penpot

    environment:
      # You can increase the max memory size if you have sufficient resources,
      # although this should not be necessary.
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
