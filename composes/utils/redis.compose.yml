services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  redis_data:

networks:
  database_internal:
    external: true
    name: network_database
