name: matrix

x-common: &common
  restart: unless-stopped
  networks:
    - database
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  synapse:
    <<: *common
    image: docker.io/matrixdotorg/synapse:latest
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_CACHE_FACTOR: "0.1"
      MALLOC_TRIM_THRESHOLD_: "65536"
    ports:
      - "100.125.151.17:8008:8008"
    volumes:
      - /home/ubuntu/matrix/synapse/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 550M
        reservations:
          memory: 256M
networks:
  database:
    external: true
    name: network_database
