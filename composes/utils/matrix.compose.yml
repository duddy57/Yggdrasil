name: matrix

x-common: &common
  restart: unless-stopped
  networks:
    - public
    - database
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  synapse:
    <<: *common
    image: docker.io/matrixdotorg/synapse:latest
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - /home/ubuntu/matrix/synapse/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public_attachable"
      - "traefik.http.routers.synapse.rule=Host(`${SYNAPSE_HOST}`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls=true"
      - "traefik.http.routers.synapse.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"
      - traefik.http.routers.https-synapse.service=synapse
volumes:
  synapse_data:


networks:
  database:
    external: true
    name: network_database
  public:
    external: true
    name: network_public_attachable
