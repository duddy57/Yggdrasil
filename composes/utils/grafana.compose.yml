services:
  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    ports:
      - "${GRAFANA_IP_HOST}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "true"
      GF_SERVER_ROOT_URL: http://${GRAFANA_IP_HOST}:3000

      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_METRICS_ENABLED: "false"
    volumes:
      - /var/lib/grafana:/var/lib/grafana
      - /etc/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /etc/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring
      - network_public
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  grafana_data:

networks:
  monitoring:
    driver: bridge
  network_public:
    external: true
